<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#FEFCF6">
<title>Feather</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--bg:#F5EFE6;--bg2:#FEFCF6;--bg3:#ECDDC8;
--tx:#2C2013;--tx2:#8A7A65;--tx3:#B89B82;
--ac:#7D5A44;--ac2:#6B4D3A;--acl:#F0E5D8;
--bd:#E3D8C8;--ubg:#ECDDC8;--abg:#FEFCF6;
--sbbg:#F2EADD;--thbg:#F0E8DC;--thbd:#E3D8C8;
--card:#FEFCF6;--ibg:#FEFCF6;
--sh:0 1px 3px rgba(0,0,0,.05);--sh2:0 4px 16px rgba(0,0,0,.08);
--st:env(safe-area-inset-top);--sbt:env(safe-area-inset-bottom)
}
[data-theme="dark"]{
--bg:#1C1814;--bg2:#262018;--bg3:#342C22;
--tx:#E5DDD4;--tx2:#A89880;--tx3:#7A6E5E;
--ac:#C49070;--ac2:#D4A080;--acl:#382C20;
--bd:#3A3228;--ubg:#382C20;--abg:#262018;
--sbbg:#1F1912;--thbg:#2C2518;--thbd:#3A3228;
--card:#262018;--ibg:#2E2820;
--sh:0 1px 3px rgba(0,0,0,.2);--sh2:0 4px 16px rgba(0,0,0,.3)
}
html{background:var(--bg2)}
html,body{height:100%;width:100%;overflow:hidden;position:fixed;top:0;left:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg2);color:var(--tx);-webkit-text-size-adjust:100%}
#app{position:fixed;top:0;left:0;right:0;height:100%;display:flex;flex-direction:column;overflow:hidden;background:var(--bg2);transform:translateZ(0)}
#stack{flex:1 1 auto;min-height:0;position:relative;overflow:hidden}
.view{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden;background:var(--bg2)}
.view.active{display:flex}
#tabbar{flex-shrink:0;display:flex;background:var(--bg2);border-top:1px solid var(--bd);padding-bottom:var(--sbt)}
.tbi{flex:1;background:none;border:none;padding:5px 0 3px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;color:var(--tx3);font-size:9px;transition:color .15s}
.tbi.act{color:var(--ac)}
.tbi svg{width:20px;height:20px;stroke-width:1.9}
body.kb #tabbar{display:none}
body.kb .inp{padding-bottom:6px}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:90}
#overlay.show{display:block}
/*★侧边栏：铺满，底部自己吃安全区*/
#sidebar{position:fixed;left:-290px;top:0;bottom:0;width:290px;background:var(--sbbg);z-index:100;transition:left .28s ease;display:flex;flex-direction:column;overflow:hidden;padding-top:var(--st);transform:translateZ(0)}
#sidebar.open{left:0}
.sb-hd{padding:12px;flex-shrink:0}
.new-btn{width:100%;padding:11px;background:var(--ac);color:#FFF;border:none;border-radius:10px;font-size:15px;cursor:pointer}
.new-btn:active{background:var(--ac2)}
.sb-list{flex:1 1 auto;min-height:0;overflow-y:auto;padding:2px 8px;padding-bottom:calc(10px + var(--sbt));background:var(--sbbg)}
.sb-item{padding:11px;border-radius:10px;cursor:pointer;display:flex;align-items:center;margin-bottom:2px;font-size:14px;gap:4px}
.sb-item:active,.sb-item.act{background:var(--acl)}
.sb-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.sb-act{background:none;border:none;color:var(--tx3);cursor:pointer;padding:0 3px;opacity:0;font-size:14px;flex-shrink:0}
.sb-item.act .sb-act{opacity:.5}
.hd{display:flex;align-items:center;padding:7px 10px;padding-top:calc(9px + var(--st));background:var(--bg2);border-bottom:1px solid var(--bd);min-height:44px;flex-shrink:0}
.ib{background:none;border:none;color:var(--tx);font-size:18px;cursor:pointer;padding:3px 6px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.hd-title{font-size:15px;font-weight:600;flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd-acts{display:flex;align-items:center;gap:6px}
.hd-save{background:none;border:none;color:var(--ac);font-size:15px;font-weight:600;cursor:pointer;padding:4px 6px}
.body-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sbar{display:none;padding:6px 14px;background:var(--bg2);border-bottom:1px solid var(--bd);align-items:center;gap:8px;flex-shrink:0}
.sbar.show{display:flex}
.sbar input{flex:1;padding:6px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--ibg);color:var(--tx);font-size:16px;outline:none}
.scnt{font-size:11px;color:var(--tx3);white-space:nowrap}
.chat-area{padding:14px 14px 6px;background:var(--bg)}
.chat-area.searching .msg{opacity:.2}
.chat-area.searching .msg.hl{opacity:1}
.msg{margin-bottom:14px;display:flex;flex-direction:column}
.msg.u{align-items:flex-end}
.msg.a{align-items:flex-start}
.bub{max-width:82%;padding:10px 14px;border-radius:16px;font-size:15px;line-height:1.65;word-wrap:break-word;overflow-wrap:break-word}
.msg.u .bub{background:var(--ubg);border-bottom-right-radius:4px}
.msg.a .bub{background:var(--abg);border-bottom-left-radius:4px;box-shadow:var(--sh)}
.ts{font-size:11px;color:var(--tx3);margin-top:3px;padding:0 4px;display:flex;align-items:center;gap:6px}
.msg-edit{background:none;border:none;color:var(--tx3);font-size:11px;cursor:pointer;opacity:.6}
.mimg{max-width:200px;max-height:200px;border-radius:12px;margin-bottom:6px;display:block}
.thk{margin-bottom:6px;border:1px solid var(--thbd);border-radius:10px;overflow:hidden;max-width:82%}
.thk-hd{padding:7px 12px;background:var(--thbg);cursor:pointer;font-size:13px;color:var(--tx2);display:flex;align-items:center;gap:6px;user-select:none;-webkit-user-select:none}
.thk-bd{display:none;padding:10px 12px;background:var(--thbg);font-size:13px;line-height:1.6;color:var(--tx2);max-height:280px;overflow-y:auto;white-space:pre-wrap}
.thk.open .thk-bd{display:block}
.thk.open .ar{transform:rotate(90deg)}
.ar{transition:transform .2s;display:inline-block;font-size:10px}
.bub code{background:var(--bg3);padding:1px 5px;border-radius:4px;font-size:13px;font-family:'SF Mono',Monaco,Consolas,monospace}
.bub pre{background:var(--bg3);padding:10px;border-radius:8px;overflow-x:auto;margin:6px 0}
.bub pre code{background:none;padding:0}
.typ-wrap{display:flex;align-items:center;gap:8px}
.typ-label{font-size:13px;color:var(--tx3)}
.typ{display:flex;gap:4px}
.typ span{width:5px;height:5px;border-radius:50%;background:var(--tx3);animation:tb 1.4s infinite}
.typ span:nth-child(2){animation-delay:.2s}
.typ span:nth-child(3){animation-delay:.4s}
@keyframes tb{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
.empty{text-align:center;padding:60px 20px;color:var(--tx3);font-size:15px}
#stopBtn{display:none;margin:8px auto;padding:6px 20px;background:var(--bg2);border:1px solid var(--bd);border-radius:20px;color:var(--tx2);font-size:13px;cursor:pointer}
#stopBtn.show{display:block}
.imgp{display:none;padding:6px 14px;background:var(--bg2);border-top:1px solid var(--bd);align-items:center;gap:8px;flex-shrink:0}
.imgp.show{display:flex}
.imgp img{width:48px;height:48px;object-fit:cover;border-radius:8px}
.imgp button{background:none;border:none;color:var(--tx2);font-size:20px;cursor:pointer}
.inp{padding:6px 10px;background:var(--bg2);border-top:1px solid var(--bd);display:flex;align-items:flex-end;gap:7px;flex-shrink:0;transform:translateZ(0)}
.att{background:none;border:none;color:var(--tx3);font-size:22px;cursor:pointer;flex-shrink:0;width:33px;height:33px;display:flex;align-items:center;justify-content:center;position:relative;bottom:2px}
.att:active{color:var(--ac)}
#mi{flex:1;border:1px solid var(--bd);border-radius:18px;padding:7px 13px;font-size:16px;background:var(--ibg);color:var(--tx);resize:none;max-height:110px;min-height:33px;font-family:inherit;line-height:1.4;outline:none}
#mi:focus{border-color:var(--ac)}
#sb{background:var(--ac);color:#FFF;border:none;width:33px;height:33px;border-radius:50%;font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
#sb:disabled{opacity:.35}
.pad{padding:14px;padding-bottom:calc(14px + var(--sbt));background:var(--bg)}
.search{margin-bottom:12px}
.search input{width:100%;padding:10px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--ibg);color:var(--tx);font-size:16px;outline:none}
.mem-list,.dia-list{display:flex;flex-direction:column;gap:10px}
.mc{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;box-shadow:var(--sh)}
.mc.locked{border-left:3px solid var(--ac)}
.mc-body{font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word;margin-bottom:10px}
.mc-ft{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--tx3)}
.mc-acts{display:flex;gap:10px}
.mc-acts button{background:none;border:none;color:var(--ac);font-size:12px;cursor:pointer;padding:2px}
.mc-acts button:disabled{opacity:.3}
.mc-acts .lk{color:var(--tx2)}
.dc{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:15px;box-shadow:var(--sh)}
.dc-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.dc-who{display:flex;align-items:center;gap:7px}
.dc-name{font-size:14px;font-weight:600}
.dc-dot{width:6px;height:6px;border-radius:50%;background:var(--ac)}
.dc-dot.me{background:var(--tx3)}
.dc-time{font-size:11px;color:var(--tx3)}
.dc-del{background:none;border:none;color:var(--tx3);font-size:16px;cursor:pointer;padding:0 4px;opacity:.4}
.dc-body{font-size:15px;line-height:1.7;white-space:pre-wrap;word-break:break-word;margin-bottom:10px}
.dc-img{width:100%;max-height:270px;object-fit:cover;border-radius:12px;margin-bottom:10px;display:block}
.dc-cmts{border-top:1px solid var(--bd);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.cmt{padding:8px 10px;background:var(--bg3);border-radius:10px}
.cmt-hd{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.cmt-name{font-size:12px;font-weight:600;color:var(--ac)}
.cmt-name.me{color:var(--tx2)}
.cmt-time{font-size:10px;color:var(--tx3)}
.cmt-body{font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.cmt-add{display:flex;gap:6px;margin-top:4px}
.cmt-add input{flex:1;padding:7px 10px;border:1px solid var(--bd);border-radius:14px;background:var(--ibg);color:var(--tx);font-size:16px;outline:none}
.cmt-add button{background:var(--ac);color:#FFF;border:none;padding:0 14px;border-radius:14px;font-size:13px;cursor:pointer}
.hint-empty{text-align:center;padding:50px 20px;color:var(--tx3);font-size:14px;line-height:1.8}
.lgroup{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin-bottom:16px}
.lrow{display:flex;align-items:center;padding:13px 14px;border-bottom:1px solid var(--bd);cursor:pointer;font-size:15px;color:var(--tx);background:none;border-left:none;border-right:none;border-top:none;width:100%;text-align:left}
.lrow:last-child{border-bottom:none}
.lrow:active{background:var(--acl)}
.lrow .lv{flex:1}
.lrow .rv{font-size:13px;color:var(--tx3);margin-right:6px}
.lrow .cv{color:var(--tx3);font-size:16px}
.gtitle{font-size:12px;color:var(--tx3);padding:0 4px 6px;letter-spacing:.5px}
.sub{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg2);z-index:5}
.sub.active{display:flex}
.fld{margin-bottom:16px}
.fld label{display:block;font-size:13px;color:var(--tx2);margin-bottom:5px;font-weight:500}
.fld input,.fld textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--ibg);color:var(--tx);font-size:16px;font-family:inherit;outline:none}
.fld input:focus,.fld textarea:focus{border-color:var(--ac)}
.fld textarea{min-height:100px;resize:vertical;line-height:1.5}
.fld .hint{font-size:12px;color:var(--tx3);margin-top:4px}
.tr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.tr label{font-size:14px;color:var(--tx)}
.tg{width:44px;height:24px;border-radius:12px;background:var(--bd);position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}
.tg.on{background:var(--ac)}
.tg::after{content:'';position:absolute;width:20px;height:20px;border-radius:50%;background:#FFF;top:2px;left:2px;transition:left .2s}
.tg.on::after{left:22px}
.dbtn{display:block;width:100%;padding:12px;border-radius:10px;font-size:14px;cursor:pointer;margin-bottom:8px;text-align:center}
.dbtn-p{background:var(--ac);color:#FFF;border:none}
.dbtn-s{background:none;color:var(--tx);border:1px solid var(--bd)}
.dbtn-d{background:none;color:#C44;border:1px solid #C44;margin-top:14px}
.modal{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.4);align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.mdl{background:var(--card);border-radius:14px;padding:20px;width:100%;max-width:380px;box-shadow:var(--sh2);max-height:80vh;overflow-y:auto}
.mdl h3{margin-bottom:12px;font-size:16px}
.mdl textarea{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--ibg);color:var(--tx);font-size:16px;font-family:inherit;min-height:110px;resize:vertical;outline:none;line-height:1.5}
.mdl input[type=text]{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--ibg);color:var(--tx);font-size:16px;outline:none}
.mdl-acts{display:flex;gap:8px;margin-top:12px}
.mdl-acts button{flex:1;padding:10px;border-radius:10px;font-size:14px;cursor:pointer;border:none}
.btn-p{background:var(--ac);color:#FFF}
.btn-s{background:var(--bg3);color:var(--tx)}
.dimgp{display:none;margin-top:10px;align-items:center;gap:8px}
.dimgp.show{display:flex}
.dimgp img{width:56px;height:56px;object-fit:cover;border-radius:8px}
.dimgp button{background:none;border:none;color:var(--tx2);font-size:20px;cursor:pointer}
.dadd{background:none;border:1px dashed var(--bd);color:var(--tx2);padding:8px 14px;border-radius:10px;font-size:13px;cursor:pointer;margin-top:10px;width:100%}
#lock{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:40px}
#lock input{width:200px;padding:12px 16px;border:1px solid var(--bd);border-radius:12px;background:var(--ibg);color:var(--tx);font-size:16px;outline:none;text-align:center;letter-spacing:4px}
#lock button{padding:10px 32px;background:var(--ac);color:#FFF;border:none;border-radius:12px;font-size:14px;cursor:pointer}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}
</style>
</head>
<body>
<div id="lock">
<div style="font-size:14px;color:var(--tx3);letter-spacing:2px">Feather</div>
<input type="password" id="lki" placeholder="······" inputmode="numeric">
<button onclick="tryUnlock()">进入</button>
<div id="lkerr" style="font-size:12px;color:#C44;height:16px"></div>
</div>
<div id="overlay" onclick="closeSb()"></div>
<aside id="sidebar">
<div class="sb-hd"><button class="new-btn" onclick="newChat()">+ 新对话</button></div>
<div class="sb-list" id="clist"></div>
</aside>
<div id="app">
<div id="stack">

<div id="chatView" class="view active">
<div class="hd">
<button class="ib" onclick="openSb()">☰</button>
<div class="hd-title"></div>
<div class="hd-acts">
<button class="ib" onclick="toggleSearch()"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="10" cy="10" r="7"/><line x1="16" y1="16" x2="21" y2="21"/></svg></button>
<button class="ib" id="tb" onclick="toggleTh()">☽</button>
</div>
</div>
<div class="sbar" id="sbar">
<input id="sinp" placeholder="搜索消息..." oninput="doSearch()">
<span class="scnt" id="scnt"></span>
<button onclick="toggleSearch()" style="background:none;border:none;color:var(--tx2);font-size:16px">×</button>
</div>
<div class="body-scroll chat-area" id="ca"><div id="msgs"></div><button id="stopBtn" onclick="stopG()">停止生成</button></div>
<div class="imgp" id="ip"><img id="pimg"><button onclick="rmImg()">×</button></div>
<div class="inp">
<button class="att" onclick="document.getElementById('fi').click()">+</button>
<input type="file" id="fi" accept="image/*" onchange="hImg(event)" hidden>
<textarea id="mi" placeholder="给Renn发消息..." rows="1" oninput="aH(this)"></textarea>
<button id="sb" onclick="send()">↑</button>
</div>
</div>

<div id="diaryView" class="view">
<div class="hd"><div style="width:30px"></div><div class="hd-title">日记</div><button class="ib" onclick="openDiaryModal()">＋</button></div>
<div class="body-scroll pad"><div id="dl" class="dia-list"></div></div>
</div>

<div id="usView" class="view">
<div class="hd"><div style="width:30px"></div><div class="hd-title">我们</div><div style="width:30px"></div></div>
<div class="body-scroll pad">
<div class="hint-empty">
这里之后会有——<br><br>
<b>Renn</b>：自我描述 / 此刻 / 念头流 / 我想问你的<br>
<b>小u</b>：自我描述 / 此刻 / 念头流<br><br>
<span style="opacity:.6">v2b 填进来</span>
</div>
</div>
</div>

<div id="setView" class="view">
<div class="hd"><div style="width:30px"></div><div class="hd-title">设置</div><div style="width:30px"></div></div>
<div class="body-scroll pad">
<div class="gtitle">通用</div>
<div class="lgroup">
<button class="lrow" onclick="openSub('subMem')"><span class="lv">记忆碎片</span><span class="rv" id="memCnt"></span><span class="cv">›</span></button>
<button class="lrow" onclick="toggleTh()"><span class="lv">深色模式</span><span class="rv" id="thLabel"></span><span class="cv">›</span></button>
</div>
<div class="gtitle">连接</div>
<div class="lgroup">
<button class="lrow" onclick="openSub('subApi')"><span class="lv">API 服务</span><span class="rv" id="apiState"></span><span class="cv">›</span></button>
<button class="lrow" onclick="openSub('subChat')"><span class="lv">对话参数</span><span class="cv">›</span></button>
<button class="lrow" onclick="openSub('subMemSet')"><span class="lv">记忆与上下文</span><span class="cv">›</span></button>
</div>
<div class="gtitle">数据</div>
<div class="lgroup">
<button class="lrow" onclick="openSub('subData')"><span class="lv">备份与重置</span><span class="cv">›</span></button>
</div>
</div>

<div class="sub" id="subMem">
<div class="hd"><button class="ib" onclick="closeSub()">←</button><div class="hd-title">记忆碎片</div><button class="ib" onclick="addMem()">＋</button></div>
<div class="body-scroll pad">
<div class="search"><input id="ms" placeholder="搜索记忆..." oninput="rMems()"></div>
<div id="ml" class="mem-list"></div>
</div>
</div>

<div class="sub" id="subApi">
<div class="hd"><button class="ib" onclick="closeSub()">←</button><div class="hd-title">API 服务</div><button class="hd-save" onclick="saveS()">保存</button></div>
<div class="body-scroll pad">
<div class="fld"><label>API Key</label><input type="password" id="sk" placeholder="sk-..."></div>
<div class="fld"><label>API 地址</label><input id="su" placeholder="https://..../v1"></div>
<div class="fld"><label>模型</label><input id="smo" placeholder="claude-sonnet-4-..."></div>
<div class="fld"><div class="hint">三项都填好才能发送消息</div></div>
</div>
</div>

<div class="sub" id="subChat">
<div class="hd"><button class="ib" onclick="closeSub()">←</button><div class="hd-title">对话参数</div><button class="hd-save" onclick="saveS()">保存</button></div>
<div class="body-scroll pad">
<div class="fld"><label>AI 昵称</label><input id="san" placeholder="Renn"></div>
<div class="fld"><label>我的昵称</label><input id="sun" placeholder="小u"></div>
<div class="fld"><label>System Prompt</label><textarea id="ss" rows="6" placeholder="可选"></textarea></div>

<button class="tbi" id="tab-diary" onclick="go('diary')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg><span>日记</span></button>

<div class="modal" id="mm"><div class="mdl"><h3 id="mmt">添加记忆</h3><textarea id="mmi" placeholder="输入记忆内容..."></textarea><div class="mdl-acts"><button class="btn-s" onclick="closeMd('mm')">取消</button><button class="btn-p" onclick="saveMem()">保存</button></div></div></div>
<div class="modal" id="emm"><div class="mdl"><h3>编辑消息</h3><textarea id="emmi"></textarea><div class="mdl-acts"><button class="btn-s" onclick="closeMd('emm')">取消</button><button class="btn-p" onclick="resendMsg()">重新发送</button></div></div></div>
<div class="modal" id="tmm"><div class="mdl"><h3>编辑标题</h3><input type="text" id="tmi"><div class="mdl-acts"><button class="btn-s" onclick="closeMd('tmm')">取消</button><button class="btn-p" onclick="saveTitle()">保存</button></div></div></div>
<div class="modal" id="dmm"><div class="mdl"><h3>写日记</h3><textarea id="dmi" placeholder="今天想说点什么..."></textarea><button class="dadd" onclick="document.getElementById('dfi').click()">+ 添加图片</button><input type="file" id="dfi" accept="image/*" onchange="hDiaryImg(event)" hidden><div class="dimgp" id="dip"><img id="dpimg"><button onclick="rmDiaryImg()">×</button></div><div class="mdl-acts"><button class="btn-s" onclick="closeMd('dmm')">取消</button><button class="btn-p" onclick="saveDiary()">发布</button></div></div></div>

<script>
const PASS='520720';
let S={convs:{},cur:null,sets:{key:'',url:'',model:'',sys:'',think:false,budget:10000,maxTok:16000,incMem:true,incTime:true,maxMem:0,aiName:'Renn',userName:'小u',temp:1,tools:true,diaryCtx:10},mems:[],diary:[],gen:false,ac:null,pimg:null,dpimg:null,emid:null,editIdx:null,titleId:null,tab:'chat'};
const TOOLS=[
{name:'create_memory',description:'创建一条新的记忆记录',input_schema:{type:'object',properties:{content:{type:'string'}},required:['content']}},
{name:'edit_memory',description:'更新已有的记忆记录',input_schema:{type:'object',properties:{id:{type:'integer'},content:{type:'string'}},required:['id','content']}},
{name:'delete_memory',description:'删除一条记忆记录',input_schema:{type:'object',properties:{id:{type:'integer'}},required:['id']}},
{name:'create_diary',description:'在共享日记本发布一篇日记',input_schema:{type:'object',properties:{content:{type:'string'}},required:['content']}},
{name:'add_comment',description:'在某篇日记下添加评论',input_schema:{type:'object',properties:{diary_id:{type:'integer'},content:{type:'string'}},required:['diary_id','content']}}
];
function execTool(n,i){try{
if(n==='create_memory'){if(!i.content)return'失败：内容为空';S.mems.push({content:i.content,locked:false,createdAt:Date.now()});save();return'已创建记忆 id='+(S.mems.length-1)}
if(n==='edit_memory'){let x=i.id;if(x===undefined||!S.mems[x])return'失败：id不存在';if(S.mems[x].locked)return'失败：已锁定';S.mems[x].content=i.content;save();return'已更新 id='+x}
if(n==='delete_memory'){let x=i.id;if(x===undefined||!S.mems[x])return'失败：id不存在';if(S.mems[x].locked)return'失败：已锁定';S.mems.splice(x,1);save();return'已删除 id='+x}
if(n==='create_diary'){if(!i.content)return'失败：内容为空';S.diary.push({author:'ai',content:i.content,ts:Date.now(),comments:[]});save();return'已发布日记 id='+(S.diary.length-1)}
if(n==='add_comment'){let x=i.diary_id;if(x===undefined||!S.diary[x])return'失败：日记id不存在';if(!S.diary[x].comments)S.diary[x].comments=[];S.diary[x].comments.push({author:'ai',content:i.content,ts:Date.now()});save();return'已评论日记 '+x}
return'未知工具'}catch(e){return'执行出错：'+e.message}}
function tryUnlock(){if(document.getElementById('lki').value===PASS){sessionStorage.setItem('fw_unlock','1');document.getElementById('lock').style.display='none';init()}else{document.getElementById('lkerr').textContent='密码错误';document.getElementById('lki').value=''}}
function init(){load();applyTh();renderCL();if(S.cur&&S.convs[S.cur])renderMs();else newChat();loadSU();updPH();initKB();
document.getElementById('mi').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}})}
function initKB(){
var vv=window.visualViewport;if(!vv)return;
var app=document.getElementById('app');
var base=vv.height;
function apply(){
var h=vv.height;
if(h>base)base=h;
app.style.height=h+'px';
var closed=(base-h)<80;
document.body.classList.toggle('kb',!closed);
if(vv.offsetTop>0)window.scrollTo(0,0);
if(!closed)scrD();
}
vv.addEventListener('resize',apply);
vv.addEventListener('scroll',apply);
window.addEventListener('orientationchange',function(){setTimeout(function(){base=vv.height;apply()},400)});
apply()}
function load(){try{let s=localStorage.getItem('fw_s');if(s)S.sets={...S.sets,...JSON.parse(s)};let c=localStorage.getItem('fw_c');if(c)S.convs=JSON.parse(c);let m=localStorage.getItem('fw_m');if(m)S.mems=JSON.parse(m);let d=localStorage.getItem('fw_d');if(d)S.diary=JSON.parse(d);S.cur=localStorage.getItem('fw_cur')}catch(e){}}
function save(){localStorage.setItem('fw_s',JSON.stringify(S.sets));localStorage.setItem('fw_c',JSON.stringify(S.convs));localStorage.setItem('fw_m',JSON.stringify(S.mems));localStorage.setItem('fw_d',JSON.stringify(S.diary));if(S.cur)localStorage.setItem('fw_cur',S.cur)}
function updPH(){document.getElementById('mi').placeholder='给'+(S.sets.aiName||'Renn')+'发消息...'}
function toggleTh(){let n=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);localStorage.setItem('fw_th',n);syncTh(n)}
function applyTh(){let t=localStorage.getItem('fw_th')||'light';document.documentElement.setAttribute('data-theme',t);syncTh(t)}
function syncTh(t){let tb=document.getElementById('tb');if(tb)tb.textContent=t==='dark'?'☀':'☽';let l=document.getElementById('thLabel');if(l)l.textContent=t==='dark'?'开':'关';let mt=document.querySelector('meta[name=theme-color]');if(mt)mt.content=t==='dark'?'#262018':'#FEFCF6'}
function openSb(){document.getElementById('sidebar').classList.add('open');document.getElementById('overlay').classList.add('show')}
function closeSb(){document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show')}
function go(v){closeSb();closeSub();S.tab=v;document.querySelectorAll('.view').forEach(e=>e.classList.remove('active'));document.getElementById(v+'View').classList.add('active');document.querySelectorAll('.tbi').forEach(e=>e.classList.remove('act'));document.getElementById('tab-'+v).classList.add('act');if(v==='diary')rDiary();if(v==='set'){loadSU();refreshSetList()}if(v==='chat')scrD()}
function refreshSetList(){document.getElementById('memCnt').textContent=S.mems.length+' 条';document.getElementById('apiState').textContent=(S.sets.key&&S.sets.url&&S.sets.model)?'已配置':'未配置';syncTh(document.documentElement.getAttribute('data-theme'))}
function openSub(id){document.getElementById(id).classList.add('active');if(id==='subMem')rMems()}
function closeSub(){document.querySelectorAll('.sub').forEach(e=>e.classList.remove('active'));refreshSetList()}
function newChat(){let id=Date.now().toString();S.convs[id]={title:'新对话',msgs:[],api:[]};S.cur=id;save();renderCL();renderMs();closeSb();go('chat')}
function switchC(id){S.cur=id;save();renderCL();renderMs();closeSb();go('chat')}
function delC(id,e){e.stopPropagation();delete S.convs[id];if(S.cur===id){let ids=Object.keys(S.convs);if(ids.length)S.cur=ids[ids.length-1];else{newChat();return}}save();renderCL();renderMs()}
function editTitle(id,e){e.stopPropagation();S.titleId=id;document.getElementById('tmi').value=S.convs[id].title;document.getElementById('tmm').classList.add('show')}
function saveTitle(){let t=document.getElementById('tmi').value.trim();if(t&&S.titleId){S.convs[S.titleId].title=t;save();renderCL()}closeMd('tmm')}
function renderCL(){let l=document.getElementById('clist');l.innerHTML='';Object.keys(S.convs).reverse().forEach(id=>{let c=S.convs[id];let d=document.createElement('div');d.className='sb-item'+(id===S.cur?' act':'');d.onclick=()=>switchC(id);d.innerHTML='<span>'+esc(c.title)+'</span><button class="sb-act" onclick="editTitle(\''+id+'\',event)">✎</button><button class="sb-act" onclick="delC(\''+id+'\',event)" style="font-size:18px">×</button>';l.appendChild(d)})}
function renderMs(){let c=document.getElementById('msgs');c.innerHTML='';let cv=S.convs[S.cur];if(!cv||!cv.msgs.length){c.innerHTML='<div class="empty">给'+esc(S.sets.aiName||'Renn')+'发消息开始对话</div>';return}cv.msgs.forEach((m,i)=>addDOM(m,i));scrD()}
function fmtTs(ts){if(!ts)return'';let d=new Date(ts),n=new Date(),h=String(d.getHours()).padStart(2,'0'),mi=String(d.getMinutes()).padStart(2,'0');return d.toDateString()===n.toDateString()?h+':'+mi:(d.getMonth()+1)+'/'+d.getDate()+' '+h+':'+mi}
function fmtFull(ts){if(!ts)return'';let d=new Date(ts);return(d.getMonth()+1)+'月'+d.getDate()+'日 '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function addDOM(m,idx){let c=document.getElementById('msgs'),d=document.createElement('div');d.className='msg '+(m.role==='user'?'u':'a');let h='';
if(m.image)h+='<img class="mimg" src="'+m.image+'">';
if(m.thinking)h+='<div class="thk" onclick="this.classList.toggle(\'open\')"><div class="thk-hd"><span class="ar">▶</span> 思考过程</div><div class="thk-bd">'+esc(m.thinking)+'</div></div>';
if(m.text)h+='<div class="bub">'+md(m.text)+'</div>';
if(m.tools&&m.tools.length)m.tools.forEach(t=>{h+='<div class="ts" style="opacity:.7">· '+esc(t)+'</div>'});
if(m.ts){h+='<div class="ts">'+fmtTs(m.ts);if(m.role==='user'&&idx!==undefined)h+='<button class="msg-edit" onclick="editUserMsg('+idx+')">编辑</button>';h+='</div>'}
d.innerHTML=h;c.appendChild(d);return d}
function scrD(){let a=document.getElementById('ca');if(a)a.scrollTop=a.scrollHeight}
function nearB(){let a=document.getElementById('ca');return a.scrollHeight-a.scrollTop-a.clientHeight<100}
function openDiaryModal(){document.getElementById('dmi').value='';rmDiaryImg();document.getElementById('dmm').classList.add('show')}
function hDiaryImg(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=function(ev){let im=new Image();im.onload=function(){let mx=800,w=im.width,h=im.height;if(w>mx||h>mx){if(w>h){h=h*mx/w;w=mx}else{w=w*mx/h;h=mx}}let cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(im,0,0,w,h);let du=cv.toDataURL('image/jpeg',.75);S.dpimg=du;document.getElementById('dpimg').src=du;document.getElementById('dip').classList.add('show')};im.src=ev.target.result};r.readAsDataURL(f);e.target.value=''}
function rmDiaryImg(){S.dpimg=null;document.getElementById('dip').classList.remove('show');document.getElementById('dpimg').src=''}
function saveDiary(){let c=document.getElementById('dmi').value.trim();if(!c&&!S.dpimg)return;let e={author:'user',content:c,ts:Date.now(),comments:[]};if(S.dpimg)e.image=S.dpimg;S.diary.push(e);save();closeMd('dmm');rmDiaryImg();rDiary()}
function delDiary(i){if(!confirm('删除这篇日记？'))return;S.diary.splice(i,1);save();rDiary()}
function addCmt(i){let inp=document.getElementById('ci'+i),t=inp.value.trim();if(!t)return;if(!S.diary[i].comments)S.diary[i].comments=[];S.diary[i].comments.push({author:'user',content:t,ts:Date.now()});save();rDiary()}
function rDiary(){let l=document.getElementById('dl');l.innerHTML='';if(!S.diary.length){l.innerHTML='<div class="hint-empty">还没有日记<br>点右上角 ＋ 写第一篇</div>';return}
let an=esc(S.sets.aiName||'Renn'),un=esc(S.sets.userName||'我');
S.diary.slice().reverse().forEach(d=>{let i=S.diary.indexOf(d),isMe=d.author==='user',c=document.createElement('div');c.className='dc';
let h='<div class="dc-hd"><div class="dc-who"><span class="dc-dot'+(isMe?' me':'')+'"></span><span class="dc-name">'+(isMe?un:an)+'</span><span class="dc-time">'+fmtFull(d.ts)+'</span></div><button class="dc-del" onclick="delDiary('+i+')">×</button></div>';
if(d.image)h+='<img class="dc-img" src="'+d.image+'">';
if(d.content)h+='<div class="dc-body">'+esc(d.content)+'</div>';
h+='<div class="dc-cmts">';
if(d.comments&&d.comments.length)d.comments.forEach(cm=>{let me=cm.author==='user';h+='<div class="cmt"><div class="cmt-hd"><span class="cmt-name'+(me?' me':'')+'">'+(me?un:an)+'</span><span class="cmt-time">'+fmtFull(cm.ts)+'</span></div><div class="cmt-body">'+esc(cm.content)+'</div></div>'});
h+='<div class="cmt-add"><input id="ci'+i+'" placeholder="说点什么..."><button onclick="addCmt('+i+')">发送</button></div></div>';
c.innerHTML=h;l.appendChild(c)})}
function toggleSearch(){let b=document.getElementById('sbar');if(b.classList.contains('show')){b.classList.remove('show');clearSearch()}else b.classList.add('show')}
function doSearch(){let q=document.getElementById('sinp').value.trim().toLowerCase(),a=document.getElementById('ca'),ms=document.querySelectorAll('#msgs .msg');if(!q){clearSearch();return}a.classList.add('searching');let n=0;ms.forEach(m=>{if(m.textContent.toLowerCase().includes(q)){m.classList.add('hl');n++}else m.classList.remove('hl')});document.getElementById('scnt').textContent=n+'个结果'}
function clearSearch(){document.getElementById('sinp').value='';document.getElementById('scnt').textContent='';document.getElementById('ca').classList.remove('searching');document.querySelectorAll('#msgs .msg').forEach(m=>m.classList.remove('hl'))}
function editUserMsg(i){S.editIdx=i;document.getElementById('emmi').value=S.convs[S.cur].msgs[i].text||'';document.getElementById('emm').classList.add('show')}
function resendMsg(){let t=document.getElementById('emmi').value.trim();if(!t)return;let cv=S.convs[S.cur],ai=0,n=0;for(let i=0;i<cv.api.length;i++){let m=cv.api[i];if(m.role==='user'&&!(Array.isArray(m.content)&&m.content[0]&&m.content[0].type==='tool_result')){if(n===S.editIdx){ai=i;break}n++}}cv.msgs=cv.msgs.slice(0,S.editIdx);cv.api=cv.api.slice(0,ai);save();renderMs();closeMd('emm');document.getElementById('mi').value=t;send()}
function buildSys(){let p=[],an=S.sets.aiName||'Renn',un=S.sets.userName||'用户';
if(S.sets.incTime){let n=new Date(),w=['日','一','二','三','四','五','六'];p.push('[时间信息]\n当前时间: '+n.getFullYear()+'年'+(n.getMonth()+1)+'月'+n.getDate()+'日 星期'+w[n.getDay()]+' '+String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'))}
if(S.sets.incMem){let ms=S.mems;if(S.sets.maxMem>0)ms=ms.slice(0,S.sets.maxMem);let t='<memories>\n';ms.forEach((m,i)=>{t+='<record><id>'+i+'</id><content>'+m.content+'</content>'+(m.locked?'<locked>true</locked>':'')+'</record>\n'});t+='</memories>';let tip=S.sets.tools?'你可以用 create_memory / edit_memory / delete_memory 主动管理记忆。值得长期记住的主动记录，相关的合并更新而非重复创建，过时的删除。locked 的不可改。\n':'';p.push('[记忆库]\n'+tip+t)}
let n2=parseInt(S.sets.diaryCtx);if(isNaN(n2))n2=10;
if(n2>0&&S.diary.length){let st=Math.max(0,S.diary.length-n2),t='<diary>\n';for(let i=st;i<S.diary.length;i++){let d=S.diary[i];t+='<entry id="'+i+'" author="'+(d.author==='user'?un:an)+'" time="'+fmtFull(d.ts)+'">\n<content>'+(d.content||'')+'</content>'+(d.image?'\n<has_image>true</has_image>':'')+'\n';if(d.comments&&d.comments.length){t+='<comments>\n';d.comments.forEach(c=>{t+='<c author="'+(c.author==='user'?un:an)+'">'+c.content+'</c>\n'});t+='</comments>\n'}t+='</entry>\n'}t+='</diary>';
let tip=S.sets.tools?'这是你和'+un+'共享的日记本，都能发布和评论。用 create_diary 发布，用 add_comment 评论。想说的时候再说，不必每次调用。\n':'';
p.push('[日记本]\n'+tip+t)}
if(S.sets.sys)p.push(S.sets.sys);return p.join('\n\n')}
function rollbackApi(cv){while(cv.api.length){let l=cv.api[cv.api.length-1];if(l.role==='user'){cv.api.pop();continue}if(Array.isArray(l.content)&&l.content.some(b=>b.type==='tool_use')){cv.api.pop();continue}break}}
async function send(){if(S.gen)return;let inp=document.getElementById('mi'),text=inp.value.trim();if(!text&&!S.pimg)return;
if(!S.sets.key||!S.sets.url||!S.sets.model){alert('请先在 设置 → API 服务 填写 Key、地址和模型');go('set');return}
let cv=S.convs[S.cur],um={role:'user',text,ts:Date.now()},ac=[];

async function runTurn(cv,depth){if(depth>8)return;
let an=esc(S.sets.aiName||'Renn'),td=document.createElement('div');td.className='msg a';td.id='tmsg';
td.innerHTML='<div class="bub"><div class="typ-wrap"><span class="typ-label">'+an+'正在输入</span><div class="typ"><span></span><span></span><span></span></div></div></div>';
document.getElementById('msgs').appendChild(td);scrD();
let sys=buildSys(),apiMs=cv.api.map(m=>{if(m.role!=='assistant')return m;if(!S.sets.think&&Array.isArray(m.content)){let f=m.content.filter(b=>b.type!=='thinking'&&b.type!=='redacted_thinking');return{role:'assistant',content:f.length?f:'...'}}return m});
let body={model:S.sets.model,max_tokens:parseInt(S.sets.maxTok)||16000,system:sys,messages:apiMs,stream:true};
if(S.sets.tools)body.tools=TOOLS;
if(S.sets.think)body.thinking={type:'enabled',budget_tokens:parseInt(S.sets.budget)||10000};
else{let t=parseFloat(S.sets.temp);if(!isNaN(t)&&t>=0&&t<=1)body.temperature=t}
let res=await fetch(S.sets.url+'/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':S.sets.key,'anthropic-version':'2023-06-01'},body:JSON.stringify(body),signal:S.ac.signal});
if(!res.ok){let e=await res.text();throw new Error('API '+res.status+': '+e)}
let tp=document.getElementById('tmsg');if(tp)tp.remove();
let reader=res.body.getReader(),dec=new TextDecoder(),buf='',thk='',rtx='',sig='',cbt=null,thkEl=null,txEl=null,blocks=[],curTool=null,tj='',sr='',tn=[];
let ad=document.createElement('div');ad.className='msg a';document.getElementById('msgs').appendChild(ad);
try{
while(true){let{done,value}=await reader.read();if(done)break;
buf+=dec.decode(value,{stream:true});let lines=buf.split('\n');buf=lines.pop()||'';
for(let line of lines){if(!line.startsWith('data: '))continue;let d=line.slice(6).trim();if(d==='[DONE]')continue;
try{let ev=JSON.parse(d);
if(ev.type==='content_block_start'){cbt=ev.content_block&&ev.content_block.type;
if(cbt==='thinking'){thk='';sig='';thkEl=document.createElement('div');thkEl.className='thk open';thkEl.innerHTML='<div class="thk-hd" onclick="this.parentElement.classList.toggle(\'open\')"><span class="ar">▶</span> 思考中...</div><div class="thk-bd"></div>';ad.appendChild(thkEl)}
else if(cbt==='text'){rtx='';txEl=document.createElement('div');txEl.className='bub';ad.appendChild(txEl)}
else if(cbt==='tool_use'){curTool={id:ev.content_block.id,name:ev.content_block.name};tj=''}}
if(ev.type==='content_block_delta'){let nb=nearB(),dl=ev.delta||{};
if(dl.type==='thinking_delta'){thk+=dl.thinking;if(thkEl)thkEl.querySelector('.thk-bd').textContent=thk}
else if(dl.type==='signature_delta'){sig=dl.signature}
else if(dl.type==='text_delta'){rtx+=dl.text;if(txEl)txEl.innerHTML=md(rtx)}
else if(dl.type==='input_json_delta'){tj+=dl.partial_json}
if(nb)scrD()}
if(ev.type==='content_block_stop'){
if(cbt==='thinking'){if(thkEl){thkEl.querySelector('.thk-hd').innerHTML='<span class="ar">▶</span> 思考过程';thkEl.classList.remove('open')}let b={type:'thinking',thinking:thk};if(sig)b.signature=sig;blocks.push(b)}
else if(cbt==='text')blocks.push({type:'text',text:rtx});
else if(cbt==='tool_use'&&curTool){let ip={};try{ip=tj?JSON.parse(tj):{}}catch(e){}curTool.input=ip;blocks.push({type:'tool_use',id:curTool.id,name:curTool.name,input:ip});
let nm={create_memory:'记录了一条记忆',edit_memory:'更新了一条记忆',delete_memory:'删除了一条记忆',create_diary:'写了一篇日记',add_comment:'在日记下留言了'}[curTool.name]||curTool.name;
tn.push(nm);let te=document.createElement('div');te.className='ts';te.style.opacity='.7';te.textContent='· '+nm;ad.appendChild(te);scrD();curTool=null}
cbt=null}
if(ev.type==='message_delta'&&ev.delta&&ev.delta.stop_reason)sr=ev.delta.stop_reason;
}catch(e){}}}
}finally{try{reader.releaseLock()}catch(e){}try{await res.body.cancel()}catch(e){}}
let ts=Date.now(),disp={role:'assistant',ts};
if(thk)disp.thinking=thk;if(rtx)disp.text=rtx;if(tn.length)disp.tools=tn;
if(thk||rtx||tn.length)cv.msgs.push(disp);
cv.api.push({role:'assistant',content:blocks});
let tu=blocks.filter(b=>b.type==='tool_use');
if(tu.length&&sr==='tool_use'){let rs=tu.map(t=>({type:'tool_result',tool_use_id:t.id,content:execTool(t.name,t.input)}));cv.api.push({role:'user',content:rs});save();await runTurn(cv,depth+1);return}
let te=document.createElement('div');te.className='ts';te.textContent=fmtTs(ts);ad.appendChild(te);save()}
function stopG(){if(S.ac){S.ac.abort();S.ac=null}}
function hImg(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=function(ev){let im=new Image();im.onload=function(){let mx=1024,w=im.width,h=im.height;if(w>mx||h>mx){if(w>h){h=h*mx/w;w=mx}else{w=w*mx/h;h=mx}}let cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(im,0,0,w,h);let du=cv.toDataURL(f.type||'image/jpeg',.8);S.pimg={data:du.split(',')[1],type:f.type||'image/jpeg',preview:du};document.getElementById('pimg').src=du;document.getElementById('ip').classList.add('show')};im.src=ev.target.result};r.readAsDataURL(f);e.target.value=''}
function rmImg(){S.pimg=null;document.getElementById('ip').classList.remove('show');document.getElementById('pimg').src=''}
function rMems(){let l=document.getElementById('ml'),q=document.getElementById('ms').value.trim().toLowerCase();l.innerHTML='';
let fl=S.mems.filter(m=>!q||m.content.toLowerCase().includes(q));
if(!fl.length){l.innerHTML='<div class="hint-empty">'+(q?'没有匹配的记忆':'还没有记忆碎片')+'</div>';return}
fl.forEach(m=>{let ri=S.mems.indexOf(m),d=document.createElement('div');d.className='mc'+(m.locked?' locked':'');
let dt=m.createdAt?new Date(m.createdAt).toLocaleDateString('zh-CN'):'';
d.innerHTML='<div class="mc-body">'+esc(m.content)+'</div><div class="mc-ft"><span>'+dt+'</span><div class="mc-acts"><button class="lk" onclick="tgLock('+ri+')">'+(m.locked?'锁定':'未锁')+'</button><button onclick="editMem('+ri+')" '+(m.locked?'disabled':'')+'>编辑</button><button onclick="delMem('+ri+')" '+(m.locked?'disabled':'')+'>删除</button></div></div>';
l.appendChild(d)})}

g('sk').value=S.sets.key;g('su').value=S.sets.url;g('smo').value=S.sets.model;
g('san').value=S.sets.aiName||'Renn';g('sun').value=S.sets.userName||'小u';g('ss').value=S.sets.sys;

S.sets.key=g('sk').value.trim();S.sets.url=g('su').value.trim().replace(/\/$/,'');S.sets.model=g('smo').value.trim();

let b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');

function importData(){let inp=document.createElement('input');inp.type='file';inp.accept='.json';
inp.onchange=function(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();
r.onload=function(ev){try{let d=JSON.parse(ev.target.result);
if(d.sets)S.sets={...S.sets,...d.sets};if(d.convs)S.convs=d.convs;if(d.mems)S.mems=d.mems;if(d.diary)S.diary=d.diary;if(d.cur)S.cur=d.cur;
save();alert('导入成功');location.reload()}catch(e){alert('导入失败：文件格式不正确')}};r.readAsText(f)};inp.click()}

function aH(el){let sc=document.getElementById('ca'),st=sc.scrollTop;el.style.height='33px';el.style.height=Math.min(el.scrollHeight,110)+'px';if(sc.scrollTop!==st)sc.scrollTop=st}
function esc(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):''}
function md(t){if(!t)return'';return t.split(/(```[\s\S]*?```)/g).map(p=>{
if(p.startsWith('```')&&p.endsWith('```')){let c=p.slice(3,-3).replace(/^\w*\n/,'');return'<pre><code>'+esc(c)+'</code></pre>'}
let h=esc(p);h=h.replace(/`([^`]+)`/g,'<code>$1</code>');h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');h=h.replace(/\*(.+?)\*/g,'<em>$1</em>');h=h.replace(/\n/g,'<br>');return h}).join('')}
