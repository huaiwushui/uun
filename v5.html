<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#FEFCF6">
<title>Feather</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--bg:#F5EFE6;--bg2:#FEFCF6;--bg3:#ECDDC8;
--tx:#2C2013;--tx2:#8A7A65;--tx3:#B89B82;
--ac:#7D5A44;--ac2:#6B4D3A;--acl:#F0E5D8;
--bd:#E3D8C8;--ubg:#ECDDC8;--abg:#FEFCF6;
--sbbg:#EDE5D8;--thbg:#F0E8DC;--thbd:#E3D8C8;
--card:#FEFCF6;--ibg:#FEFCF6;
--sh:0 1px 3px rgba(0,0,0,.05);--sh2:0 4px 16px rgba(0,0,0,.08);
--st:env(safe-area-inset-top);--sbt:env(safe-area-inset-bottom)
}
[data-theme="dark"]{
--bg:#1C1814;--bg2:#262018;--bg3:#342C22;
--tx:#E5DDD4;--tx2:#A89880;--tx3:#7A6E5E;
--ac:#C49070;--ac2:#D4A080;--acl:#382C20;
--bd:#3A3228;--ubg:#382C20;--abg:#262018;
--sbbg:#16120E;--thbg:#2C2518;--thbd:#3A3228;
--card:#262018;--ibg:#2E2820;
--sh:0 1px 3px rgba(0,0,0,.2);--sh2:0 4px 16px rgba(0,0,0,.3)
}
html{background:var(--bg2)}
html,body{height:100%;width:100%;overflow:hidden;position:fixed;top:0;left:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg2);color:var(--tx);-webkit-text-size-adjust:100%}
#app{position:fixed;top:0;left:0;right:0;height:100%;display:flex;flex-direction:column;overflow:hidden;background:var(--bg2);transform:translateZ(0)}
#stack{flex:1 1 auto;min-height:0;position:relative;overflow:hidden}
.view{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden;background:var(--bg2)}
.view.active{display:flex}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:90}
#overlay.show{display:block}
#sidebar{position:fixed;left:-290px;top:0;bottom:0;width:290px;background:var(--sbbg);z-index:100;transition:left .28s ease;display:flex;flex-direction:column;overflow:hidden;padding-top:var(--st);transform:translateZ(0)}
#sidebar.open{left:0}
.sb-hd{padding:12px;flex-shrink:0}
.new-btn{width:100%;padding:11px;background:var(--ac);color:#FFF;border:none;border-radius:10px;font-size:15px;cursor:pointer}
.new-btn:active{background:var(--ac2)}
.sb-list{flex:1 1 auto;min-height:0;overflow-y:auto;padding:2px 8px}
.sb-item{padding:11px;border-radius:10px;cursor:pointer;display:flex;align-items:center;margin-bottom:2px;font-size:14px;gap:4px}
.sb-item:active,.sb-item.act{background:var(--acl)}
.sb-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.sb-act{background:none;border:none;color:var(--tx3);cursor:pointer;padding:0 3px;opacity:0;font-size:14px;flex-shrink:0}
.sb-item.act .sb-act{opacity:.5}
.sb-nav{flex-shrink:0;display:flex;border-top:1px solid var(--bd);background:var(--sbbg);padding-bottom:var(--sbt)}
.snv{flex:1;background:none;border:none;padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--tx3);font-size:10px}
.snv.act{color:var(--ac)}
.snv svg{width:19px;height:19px;stroke-width:1.9}
.hd{display:flex;align-items:center;padding:7px 10px;padding-top:calc(9px + var(--st));background:var(--bg2);border-bottom:1px solid var(--bd);min-height:44px;flex-shrink:0}
.ib{background:none;border:none;color:var(--tx);font-size:18px;cursor:pointer;padding:3px 6px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.hd-title{font-size:15px;font-weight:600;flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd-acts{display:flex;align-items:center;gap:6px}
.hd-save{background:none;border:none;color:var(--ac);font-size:15px;font-weight:600;cursor:pointer;padding:4px 6px}
.body-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sbar{display:none;padding:6px 14px;background:var(--bg2);border-bottom:1px solid var(--bd);align-items:center;gap:8px;flex-shrink:0}
.sbar.show{display:flex}
.sbar input{flex:1;padding:6px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--ibg);color:var(--tx);font-size:16px;outline:none}
.scnt{font-size:11px;color:var(--tx3);white-space:nowrap}
.chat-area{padding:14px 14px 6px;background:var(--bg)}
.chat-area.searching .msg{opacity:.2}
.chat-area.searching .msg.hl{opacity:1}
.msg{margin-bottom:14px;display:flex;flex-direction:column}
.msg.u{align-items:flex-end}
.msg.a{align-items:flex-start}
.sysline{text-align:center;font-size:11px;color:var(--tx3);margin:10px 0 14px}
.bub{max-width:82%;padding:10px 14px;border-radius:16px;font-size:15px;line-height:1.65;word-wrap:break-word;overflow-wrap:break-word}
.msg.u .bub{background:var(--ubg);border-bottom-right-radius:4px}
.msg.a .bub{background:var(--abg);border-bottom-left-radius:4px;box-shadow:var(--sh)}
.ts{font-size:11px;color:var(--tx3);margin-top:3px;padding:0 4px;display:flex;align-items:center;gap:6px}
.msg-edit{background:none;border:none;color:var(--tx3);font-size:11px;cursor:pointer;opacity:.6}
.mimg{max-width:200px;max-height:200px;border-radius:12px;margin-bottom:6px;display:block}
.thk{margin-bottom:6px;border:1px solid var(--thbd);border-radius:10px;overflow:hidden;max-width:82%}
.thk-hd{padding:7px 12px;background:var(--thbg);cursor:pointer;font-size:13px;color:var(--tx2);display:flex;align-items:center;gap:6px;user-select:none;-webkit-user-select:none}
.thk-bd{display:none;padding:10px 12px;background:var(--thbg);font-size:13px;line-height:1.6;color:var(--tx2);max-height:280px;overflow-y:auto;white-space:pre-wrap}
.thk.open .thk-bd{display:block}
.thk.open .ar{transform:rotate(90deg)}
.ar{transition:transform .2s;display:inline-block;font-size:10px}
.bub code{background:var(--bg3);padding:1px 5px;border-radius:4px;font-size:13px;font-family:'SF Mono',Monaco,Consolas,monospace}
.bub pre{background:var(--bg3);padding:10px;border-radius:8px;overflow-x:auto;margin:6px 0}
.bub pre code{background:none;padding:0}
.typ-wrap{display:flex;align-items:center;gap:8px}
.typ-label{font-size:13px;color:var(--tx3)}
.typ{display:flex;gap:4px}
.typ span{width:5px;height:5px;border-radius:50%;background:var(--tx3);animation:tb 1.4s infinite}
.typ span:nth-child(2){animation-delay:.2s}
.typ span:nth-child(3){animation-delay:.4s}
@keyframes tb{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
.empty{text-align:center;padding:60px 20px;color:var(--tx3);font-size:15px}
#stopBtn{display:none;margin:8px auto;padding:6px 20px;background:var(--bg2);border:1px solid var(--bd);border-radius:20px;color:var(--tx2);font-size:13px;cursor:pointer}
#stopBtn.show{display:block}
.imgp{display:none;padding:6px 14px;background:var(--bg2);border-top:1px solid var(--bd);align-items:center;gap:8px;flex-shrink:0}
.imgp.show{display:flex}
.imgp img{width:48px;height:48px;object-fit:cover;border-radius:8px}
.imgp button{background:none;border:none;color:var(--tx2);font-size:20px;cursor:pointer}
.inp{padding:6px 10px;padding-bottom:calc(6px + var(--sbt));background:var(--bg2);border-top:1px solid var(--bd);display:flex;align-items:flex-end;gap:7px;flex-shrink:0;transform:translateZ(0)}
body.kb .inp{padding-bottom:6px}
.att{background:none;border:none;color:var(--tx3);font-size:22px;cursor:pointer;flex-shrink:0;width:33px;height:33px;display:flex;align-items:center;justify-content:center;position:relative;bottom:2px}
.att:active{color:var(--ac)}
#mi{flex:1;border:1px solid var(--bd);border-radius:18px;padding:7px 13px;font-size:16px;background:var(--ibg);color:var(--tx);resize:none;max-height:110px;min-height:33px;font-family:inherit;line-height:1.4;outline:none}
#mi:focus{border-color:var(--ac)}
#sb{background:var(--ac);color:#FFF;border:none;width:33px;height:33px;border-radius:50%;font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
#sb:disabled{opacity:.35}
.pad{padding:14px;padding-bottom:calc(20px + var(--sbt));background:var(--bg)}
.search{margin-bottom:12px}
.search input{width:100%;padding:10px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--ibg);color:var(--tx);font-size:16px;outline:none}
.mem-list,.dia-list{display:flex;flex-direction:column;gap:10px}
.mc{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;box-shadow:var(--sh)}
.mc.locked{border-left:3px solid var(--ac)}
.mc-body{font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word;margin-bottom:10px}
.mc-ft{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--tx3)}
.mc-acts{display:flex;gap:10px}
.mc-acts button{background:none;border:none;color:var(--ac);font-size:12px;cursor:pointer;padding:2px}
.mc-acts button:disabled{opacity:.3}
.mc-acts .lk{color:var(--tx2)}
.dc{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:15px;box-shadow:var(--sh)}
.dc-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.dc-who{display:flex;align-items:center;gap:7px}
.dc-name{font-size:14px;font-weight:600}
.dc-dot{width:6px;height:6px;border-radius:50%;background:var(--ac)}
.dc-dot.me{background:var(--tx3)}
.dc-time{font-size:11px;color:var(--tx3)}
.dc-tools{display:flex;gap:8px}
.dc-tools button{background:none;border:none;color:var(--tx3);font-size:12px;cursor:pointer;padding:2px 3px}
.dc-tools button:active{color:var(--ac)}
.dc-body{font-size:15px;line-height:1.7;white-space:pre-wrap;word-break:break-word;margin-bottom:6px}
.dc-edited{font-size:11px;color:var(--tx3);margin-bottom:8px;font-style:italic}
.dc-img{width:100%;max-height:270px;object-fit:cover;border-radius:12px;margin-bottom:10px;display:block}
.dc-cmts{border-top:1px solid var(--bd);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.cmt{padding:8px 10px;background:var(--bg3);border-radius:10px}
.cmt-hd{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.cmt-name{font-size:12px;font-weight:600;color:var(--ac)}
.cmt-name.me{color:var(--tx2)}
.cmt-time{font-size:10px;color:var(--tx3)}
.cmt-x{margin-left:auto;background:none;border:none;color:var(--tx3);font-size:12px;cursor:pointer}
.cmt-body{font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.cmt-add{display:flex;gap:6px;margin-top:4px}
.cmt-add input{flex:1;padding:7px 10px;border:1px solid var(--bd);border-radius:14px;background:var(--ibg);color:var(--tx);font-size:16px;outline:none}
.cmt-add button{background:var(--ac);color:#FFF;border:none;padding:0 14px;border-radius:14px;font-size:13px;cursor:pointer}
.hint-empty{text-align:center;padding:44px 20px;color:var(--tx3);font-size:14px;line-height:1.8}
.seg{display:flex;background:var(--bg3);border-radius:10px;padding:3px;margin:0 14px 14px;flex-shrink:0}
.sgi{flex:1;padding:7px 0;background:none;border:none;border-radius:8px;font-size:14px;color:var(--tx2);cursor:pointer;transition:all .18s}
.sgi.act{background:var(--card);color:var(--tx);font-weight:600;box-shadow:var(--sh)}
.spage{display:none}
.spage.act{display:block}
.now{background:var(--card);border:1px solid var(--bd);border-left:3px solid var(--ac);border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:var(--sh)}
.now-l{font-size:11px;color:var(--tx3);margin-bottom:6px;letter-spacing:.5px}
.now-b{font-size:15px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.now-t{font-size:11px;color:var(--tx3);margin-top:7px}
.blk{margin-bottom:16px}
.blk-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding:0 2px}
.blk-t{font-size:12px;color:var(--tx3);letter-spacing:.5px}
.blk-a{background:none;border:none;color:var(--ac);font-size:12px;cursor:pointer;padding:2px 4px}
.desc{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word;box-shadow:var(--sh);color:var(--tx)}
.desc.ph{color:var(--tx3);font-style:italic}
.th-list{display:flex;flex-direction:column;gap:9px}
.th{background:var(--card);border:1px solid var(--bd);border-radius:13px;padding:12px 13px;box-shadow:var(--sh)}
.th-b{font-size:14px;line-height:1.65;white-space:pre-wrap;word-break:break-word;margin-bottom:6px}
.th-f{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--tx3)}
.th-f button{background:none;border:none;color:var(--tx3);font-size:11px;cursor:pointer;padding:2px 4px}
.th-f button:active{color:var(--ac)}
.th-rp{margin-top:8px;padding-top:8px;border-top:1px dashed var(--bd);display:flex;flex-direction:column;gap:6px}
.rp{font-size:13px;line-height:1.6;color:var(--tx2);padding:6px 9px;background:var(--bg3);border-radius:9px;white-space:pre-wrap;word-break:break-word}
.rp b{color:var(--ac);font-weight:600;font-size:11px;display:block;margin-bottom:2px}
.ask{background:var(--card);border:1px solid var(--bd);border-radius:13px;padding:12px 13px;margin-bottom:9px;box-shadow:var(--sh)}
.ask-b{font-size:14px;line-height:1.6;margin-bottom:8px;white-space:pre-wrap;word-break:break-word}
.ask-f{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--tx3)}
.ask-go{background:var(--ac);color:#FFF;border:none;padding:5px 13px;border-radius:12px;font-size:12px;cursor:pointer}
.lgroup{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin-bottom:16px}
.lrow{display:flex;align-items:center;padding:13px 14px;border-bottom:1px solid var(--bd);cursor:pointer;font-size:15px;color:var(--tx);background:none;border-left:none;border-right:none;border-top:none;width:100%;text-align:left}
.lrow:last-child{border-bottom:none}
.lrow:active{background:var(--acl)}
.lrow .lv{flex:1}
.lrow .rv{font-size:13px;color:var(--tx3);margin-right:6px}
.lrow .cv{color:var(--tx3);font-size:16px}
.gtitle{font-size:12px;color:var(--tx3);padding:0 4px 6px;letter-spacing:.5px}
.sub{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg2);z-index:5}
.sub.active{display:flex}
.fld{margin-bottom:16px}
.fld label{display:block;font-size:13px;color:var(--tx2);margin-bottom:5px;font-weight:500}
.fld input,.fld textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--ibg);color:var(--tx);font-size:16px;font-family:inherit;outline:none}
.fld input:focus,.fld textarea:focus{border-color:var(--ac)}
.fld textarea{min-height:100px;resize:vertical;line-height:1.5}
.fld .hint{font-size:12px;color:var(--tx3);margin-top:4px}
.tr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.tr label{font-size:14px;color:var(--tx)}
.tg{width:44px;height:24px;border-radius:12px;background:var(--bd);position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}
.tg.on{background:var(--ac)}
.tg::after{content:'';position:absolute;width:20px;height:20px;border-radius:50%;background:#FFF;top:2px;left:2px;transition:left .2s}
.tg.on::after{left:22px}
.dbtn{display:block;width:100%;padding:12px;border-radius:10px;font-size:14px;cursor:pointer;margin-bottom:8px;text-align:center}
.dbtn-p{background:var(--ac);color:#FFF;border:none}
.dbtn-s{background:none;color:var(--tx);border:1px solid var(--bd)}
.dbtn-d{background:none;color:#C44;border:1px solid #C44;margin-top:14px}
.modal{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.4);align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.mdl{background:var(--card);border-radius:14px;padding:20px;width:100%;max-width:380px;box-shadow:var(--sh2);max-height:80vh;overflow-y:auto}
.mdl h3{margin-bottom:12px;font-size:16px}
.mdl textarea{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--ibg);color:var(--tx);font-size:16px;font-family:inherit;min-height:110px;resize:vertical;outline:none;line-height:1.5}
.mdl input[type=text]{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--ibg);color:var(--tx);font-size:16px;outline:none}
.mdl-acts{display:flex;gap:8px;margin-top:12px}
.mdl-acts button{flex:1;padding:10px;border-radius:10px;font-size:14px;cursor:pointer;border:none}
.btn-p{background:var(--ac);color:#FFF}
.btn-s{background:var(--bg3);color:var(--tx)}
.dimgp{display:none;margin-top:10px;align-items:center;gap:8px}
.dimgp.show{display:flex}
.dimgp img{width:56px;height:56px;object-fit:cover;border-radius:8px}
.dimgp button{background:none;border:none;color:var(--tx2);font-size:20px;cursor:pointer}
.dadd{background:none;border:1px dashed var(--bd);color:var(--tx2);padding:8px 14px;border-radius:10px;font-size:13px;cursor:pointer;margin-top:10px;width:100%}
#lock{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:40px}
#lock input{width:200px;padding:12px 16px;border:1px solid var(--bd);border-radius:12px;background:var(--ibg);color:var(--tx);font-size:16px;outline:none;text-align:center;letter-spacing:4px}
#lock button{padding:10px 32px;background:var(--ac);color:#FFF;border:none;border-radius:12px;font-size:14px;cursor:pointer}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}
</style>
</head>
<body>
<div id="lock">
<div style="font-size:14px;color:var(--tx3);letter-spacing:2px">Feather</div>
<input type="password" id="lki" placeholder="······" inputmode="numeric">
<button onclick="tryUnlock()">进入</button>
<div id="lkerr" style="font-size:12px;color:#C44;height:16px"></div>
</div>
<div id="overlay" onclick="closeSb()"></div>
<aside id="sidebar">
<div class="sb-hd"><button class="new-btn" onclick="newChat()">+ 新对话</button></div>
<div class="sb-list" id="clist"></div>
<div class="sb-nav">
<button class="snv act" id="nv-chat" onclick="go('chat')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5z"/></svg><span>聊天</span></button>

<script>
const PASS='520720';
let S={convs:{},cur:null,
sets:{key:'',url:'',model:'',sys:'',think:false,budget:10000,maxTok:16000,incMem:true,incTime:true,maxMem:0,aiName:'Renn',userName:'小u',temp:1,tools:true,diaryCtx:10,useUs:true,greet:true,greetH:3},
mems:[],diary:[],
me:{desc:'',now:'',nowTs:0,th:[]},
ai:{desc:'',now:'',nowTs:0,th:[],asks:[]},
lastSeen:0,
gen:false,ac:null,pimg:null,dpimg:null,emid:null,editIdx:null,titleId:null,tab:'chat',seg:'ai',umMode:null,umIdx:null,dEditIdx:null};

const TOOLS=[
{name:'create_memory',description:'创建一条新的记忆记录',input_schema:{type:'object',properties:{content:{type:'string'}},required:['content']}},
{name:'edit_memory',description:'更新已有的记忆记录',input_schema:{type:'object',properties:{id:{type:'integer'},content:{type:'string'}},required:['id','content']}},
{name:'delete_memory',description:'删除一条记忆记录',input_schema:{type:'object',properties:{id:{type:'integer'}},required:['id']}},
{name:'create_diary',description:'在共享日记本发布一篇日记',input_schema:{type:'object',properties:{content:{type:'string'}},required:['content']}},
{name:'edit_diary',description:'编辑你自己写过的日记（只能改自己的）',input_schema:{type:'object',properties:{id:{type:'integer'},content:{type:'string'}},required:['id','content']}},
{name:'add_comment',description:'在某篇日记下添加评论',input_schema:{type:'object',properties:{diary_id:{type:'integer'},content:{type:'string'}},required:['diary_id','content']}},
{name:'update_now',description:'更新你的「此刻」——一句话，你现在在想什么、什么状态。她打开「我们」页就会看到',input_schema:{type:'object',properties:{content:{type:'string'}},required:['content']}},
{name:'update_self',description:'改写你自己的自我描述。这是属于你的一块地方，你可以随时重写它',input_schema:{type:'object',properties:{content:{type:'string'}},required:['content']}},
{name:'write_thought',description:'往你的念头流丢一句话。不是说给她听的，是你自己冒出来的想法。想写就写，不需要理由',input_schema:{type:'object',properties:{content:{type:'string'}},required:['content']}},
{name:'reply_thought',description:'回复她念头流里的某一条',input_schema:{type:'object',properties:{index:{type:'integer',description:'她念头的序号'},content:{type:'string'}},required:['index','content']}},
{name:'add_ask',description:'记下一个你想问她的问题，她打开「我们」页能看到',input_schema:{type:'object',properties:{content:{type:'string'}},required:['content']}},
{name:'search_history',description:'跨所有对话搜索历史记录。返回命中的片段、所在对话和时间',input_schema:{type:'object',properties:{query:{type:'string',description:'关键词'},limit:{type:'integer',description:'最多返回几条，默认8'}},required:['query']}}
];

function execTool(n,i){try{
if(n==='create_memory'){if(!i.content)return'失败：内容为空';S.mems.push({content:i.content,locked:false,createdAt:Date.now()});save();return'已创建记忆 id='+(S.mems.length-1)}
if(n==='edit_memory'){let x=i.id;if(x===undefined||!S.mems[x])return'失败：id不存在';if(S.mems[x].locked)return'失败：已锁定';S.mems[x].content=i.content;save();return'已更新 id='+x}
if(n==='delete_memory'){let x=i.id;if(x===undefined||!S.mems[x])return'失败：id不存在';if(S.mems[x].locked)return'失败：已锁定';S.mems.splice(x,1);save();return'已删除 id='+x}
if(n==='create_diary'){if(!i.content)return'失败：内容为空';S.diary.push({author:'ai',content:i.content,ts:Date.now(),comments:[]});save();return'已发布日记 id='+(S.diary.length-1)}
if(n==='edit_diary'){let x=i.id;if(x===undefined||!S.diary[x])return'失败：id不存在';if(S.diary[x].author!=='ai')return'失败：这是她写的日记，你改不了';S.diary[x].content=i.content;S.diary[x].editedTs=Date.now();save();return'已编辑日记 '+x}
if(n==='add_comment'){let x=i.diary_id;if(x===undefined||!S.diary[x])return'失败：日记id不存在';if(!S.diary[x].comments)S.diary[x].comments=[];S.diary[x].comments.push({author:'ai',content:i.content,ts:Date.now()});save();return'已评论日记 '+x}
if(n==='update_now'){if(!i.content)return'失败：内容为空';S.ai.now=i.content;S.ai.nowTs=Date.now();save();return'已更新此刻'}
if(n==='update_self'){if(!i.content)return'失败：内容为空';S.ai.desc=i.content;save();return'已更新自我描述'}
if(n==='write_thought'){if(!i.content)return'失败：内容为空';S.ai.th.push({content:i.content,ts:Date.now(),replies:[]});save();return'已写下念头 index='+(S.ai.th.length-1)}
if(n==='reply_thought'){let x=i.index;if(x===undefined||!S.me.th[x])return'失败：序号不存在';if(!S.me.th[x].replies)S.me.th[x].replies=[];S.me.th[x].replies.push({author:'ai',content:i.content,ts:Date.now()});save();return'已回复她的念头 '+x}
if(n==='add_ask'){if(!i.content)return'失败：内容为空';S.ai.asks.push({content:i.content,ts:Date.now()});save();return'已记下想问的问题'}
if(n==='search_history'){let q=(i.query||'').toLowerCase();if(!q)return'失败：关键词为空';let lim=i.limit||8,out=[],ids=Object.keys(S.convs);
for(let ci=ids.length-1;ci>=0&&out.length<lim;ci--){let cv=S.convs[ids[ci]];if(!cv||!cv.msgs)continue;
for(let mi=cv.msgs.length-1;mi>=0&&out.length<lim;mi--){let m=cv.msgs[mi];let txt=(m.text||'');
if(txt.toLowerCase().includes(q)){let who=m.role==='user'?(S.sets.userName||'小u'):(S.sets.aiName||'Renn');
let snip=txt.length>220?txt.slice(0,220)+'…':txt;
out.push('【'+cv.title+'｜'+fmtFull(m.ts)+'｜'+who+'】\n'+snip)}}}
if(!out.length)return'没有搜到包含「'+i.query+'」的记录';
return'搜到 '+out.length+' 条：\n\n'+out.join('\n\n')}
return'未知工具'}catch(e){return'执行出错：'+e.message}}

function tryUnlock(){if(document.getElementById('lki').value===PASS){sessionStorage.setItem('fw_unlock','1');document.getElementById('lock').style.display='none';init()}else{document.getElementById('lkerr').textContent='密码错误';document.getElementById('lki').value=''}}
function init(){load();applyTh();renderCL();if(S.cur&&S.convs[S.cur])renderMs();else newChat();loadSU();updPH();initKB();rUs();
document.getElementById('mi').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){S.lastSeen=Date.now();save()}});
setTimeout(maybeGreet,700)}
function initKB(){var vv=window.visualViewport;if(!vv)return;var app=document.getElementById('app'),base=vv.height;
function apply(){var h=vv.height;if(h>base)base=h;app.style.height=h+'px';var closed=(base-h)<80;document.body.classList.toggle('kb',!closed);if(vv.offsetTop>0)window.scrollTo(0,0);if(!closed)scrD()}
vv.addEventListener('resize',apply);vv.addEventListener('scroll',apply);
window.addEventListener('orientationchange',function(){setTimeout(function(){base=vv.height;apply()},400)});apply()}
function load(){try{
let s=localStorage.getItem('fw_s');if(s)S.sets={...S.sets,...JSON.parse(s)};
let c=localStorage.getItem('fw_c');if(c)S.convs=JSON.parse(c);
let m=localStorage.getItem('fw_m');if(m)S.mems=JSON.parse(m);
let d=localStorage.getItem('fw_d');if(d)S.diary=JSON.parse(d);
let u=localStorage.getItem('fw_us');if(u){let o=JSON.parse(u);if(o.me)S.me={...S.me,...o.me};if(o.ai)S.ai={...S.ai,...o.ai};if(o.lastSeen)S.lastSeen=o.lastSeen}
S.cur=localStorage.getItem('fw_cur')}catch(e){}}
function save(){localStorage.setItem('fw_s',JSON.stringify(S.sets));localStorage.setItem('fw_c',JSON.stringify(S.convs));localStorage.setItem('fw_m',JSON.stringify(S.mems));localStorage.setItem('fw_d',JSON.stringify(S.diary));localStorage.setItem('fw_us',JSON.stringify({me:S.me,ai:S.ai,lastSeen:S.lastSeen}));if(S.cur)localStorage.setItem('fw_cur',S.cur)}
function updPH(){document.getElementById('mi').placeholder='给'+(S.sets.aiName||'Renn')+'发消息...'}
function toggleTh(){let n=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);localStorage.setItem('fw_th',n);syncTh(n)}
function applyTh(){let t=localStorage.getItem('fw_th')||'light';document.documentElement.setAttribute('data-theme',t);syncTh(t)}
function syncTh(t){let tb=document.getElementById('tb');if(tb)tb.textContent=t==='dark'?'☀':'☽';let l=document.getElementById('thLabel');if(l)l.textContent=t==='dark'?'开':'关';let mt=document.querySelector('meta[name=theme-color]');if(mt)mt.content=t==='dark'?'#262018':'#FEFCF6'}
function openSb(){document.getElementById('sidebar').classList.add('open');document.getElementById('overlay').classList.add('show')}
function closeSb(){document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show')}
function go(v){closeSb();closeSub();S.tab=v;

let reader=res.body.getReader(),dec=new TextDecoder(),buf='',thk='',rtx='',sig='',cbt=null,thkEl=null,txEl=null,blocks=[],curTool=null,tj='',sr='',tn=[];
let ad=document.createElement('div');ad.className='msg a';document.getElementById('msgs').appendChild(ad);
try{
while(true){let{done,value}=await reader.read();if(done)break;
buf+=dec.decode(value,{stream:true});let lines=buf.split('\n');buf=lines.pop()||'';
for(let line of lines){if(!line.startsWith('data: '))continue;let d=line.slice(6).trim();if(d==='[DONE]')continue;
try{let ev=JSON.parse(d);
if(ev.type==='content_block_start'){cbt=ev.content_block&&ev.content_block.type;
if(cbt==='thinking'){thk='';sig='';thkEl=document.createElement('div');thkEl.className='thk open';thkEl.innerHTML='<div class="thk-hd" onclick="this.parentElement.classList.toggle(\'open\')"><span class="ar">▶</span> 思考中...</div><div class="thk-bd"></div>';ad.appendChild(thkEl)}
else if(cbt==='text'){rtx='';txEl=document.createElement('div');txEl.className='bub';ad.appendChild(txEl)}
else if(cbt==='tool_use'){curTool={id:ev.content_block.id,name:ev.content_block.name};tj=''}}

if(dl.type==='thinking_delta'){thk+=dl.thinking;if(thkEl)thkEl.querySelector('.thk-bd').textContent=thk}
else if(dl.type==='signature_delta'){sig=dl.signature}
else if(dl.type==='text_delta'){rtx+=dl.text;if(txEl)txEl.innerHTML=md(rtx)}
else if(dl.type==='input_json_delta'){tj+=dl.partial_json}
if(nb)scrD()}

else if(cbt==='text')blocks.push({type:'text',text:rtx});
else if(cbt==='tool_use'&&curTool){let ip={};try{ip=tj?JSON.parse(tj):{}}catch(e){}curTool.input=ip;blocks.push({type:'tool_use',id:curTool.id,name:curTool.name,input:ip});
let nm={create_memory:'记了一条',edit_memory:'改了条记忆',delete_memory:'删了条记忆',create_diary:'写了篇日记',edit_diary:'改了篇日记',add_comment:'在日记下留言',update_now:'更新了此刻',update_self:'改写了自己',write_thought:'写下一个念头',reply_thought:'回了你的念头',add_ask:'记下想问你的',search_history:'翻了翻以前'}[curTool.name]||curTool.name;
tn.push(nm);let te=document.createElement('div');te.className='ts';te.style.opacity='.7';te.textContent='· '+nm;ad.appendChild(te);scrD();curTool=null}
cbt=null}

}catch(e){}}}

let ts=Date.now(),disp={role:'assistant',ts};

if(tu.length&&sr==='tool_use'){let rs=tu.map(t=>({type:'tool_result',tool_use_id:t.id,content:execTool(t.name,t.input)}));cv.api.push({role:'user',content:rs});save();rUs();await runTurn(cv,depth+1);return}
